<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安曉貞 — Portfolio</title>

<!-- 한자(安曉貞) 전용 대체 폰트. Proxima Nova Hangeul 에는 한자 글리프가 없어서 이것만 남겨둡니다. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/home.css">

<!-- Proxima Nova Hangeul (Adobe Fonts / Typekit) -->
<script>
  (function(d) {
    var config = {
      kitId: 'rgb1grk',
      scriptTimeout: 3000,
      async: true
    },
    h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
  })(document);
</script>
</head>
<body>

<main class="stage" id="stage">

  <!-- 1. 블라인드 뒤에 보이는 레이어 (이미지 자리 - 지금은 색상으로 대체) -->
  <div class="reveal" id="reveal"></div>

  <!-- 2. 직사각형 라인 박스(블라인드) : JS 가 그림 -->
  <svg class="blind" id="blind" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-hidden="true">
    <g id="slats"></g>
    <g id="lines" fill="none" stroke="#B6B6B6" stroke-width="1" shape-rendering="crispEdges"></g>
  </svg>

  <!-- 3. 고정 텍스트 레이어 -->
  <div class="content">

    <!-- 한자 → 한글 호버 -->
    <h1 class="name no-drag" id="name" aria-label="안효정">
      <span class="name__cell">
        <span class="name__flip">
          <span class="name__face">安</span>
          <span class="name__face">안</span>
        </span>
      </span>
      <span class="name__cell">
        <span class="name__flip">
          <span class="name__face">曉</span>
          <span class="name__face">효</span>
        </span>
      </span>
      <span class="name__cell">
        <span class="name__flip">
          <span class="name__face">貞</span>
          <span class="name__face">정</span>
        </span>
      </span>
    </h1>

    <p class="tagline">Designing<br>one layer<br>deeper than<br>the obvious.</p>

    <!-- 메뉴 호버 -->
    <nav class="menu no-drag" id="menu">
      <div class="menu__slot menu__slot--label"><span class="menu__word">Menu</span></div>
      <div class="menu__slot"><a class="menu__word" href="#" data-link="work">Work</a></div>
      <div class="menu__slot"><a class="menu__word" href="#" data-link="about">About</a></div>
      <div class="menu__slot"><a class="menu__word" href="#" data-link="email">Email</a></div>
      <div class="menu__slot"><a class="menu__word" href="#" data-link="linkedin">Linkedin</a></div>
    </nav>

    <!-- 물결 모션 -->
    <div class="touch" id="touch" aria-label="Touch it">
      <span class="touch__l">T</span>
      <span class="touch__l">O</span>
      <span class="touch__l">U</span>
      <span class="touch__l">C</span>
      <span class="touch__l">H</span>
      <span class="touch__l touch__l--space">&nbsp;</span>
      <span class="touch__l">I</span>
      <span class="touch__l touch__l--last">T<i class="touch__dot"></i></span>
    </div>

    <!-- 블라인드 플로팅 버튼 -->
    <button class="fab no-drag" id="fab" type="button" aria-label="블라인드 열기">
      <svg viewBox="0 0 68 67" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="0" y="0" width="68" height="20" rx="4" fill="#fff"/>
        <path d="M0 31H68M0 42H68M0 53H68" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M50 19.5V47.5" stroke="#fff" stroke-width="2.6"/>
        <circle cx="50" cy="57" r="8.8" fill="none" stroke="#fff" stroke-width="2.6"/>
      </svg>
    </button>

  </div>
</main>

<script src="assets/js/home.js"></script>
</body>
</html>
